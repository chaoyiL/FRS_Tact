# FRS 真机部署配置。
backend: jax_smolvla_frs
# 启动（默认不会自动给机器人发 START）：
#   bash ./deploy_smolvla/scripts/start_smolvla_frs.sh
# 仅检查配置路径与认证信息：
#   bash ./deploy_smolvla/scripts/start_smolvla_frs.sh --check

#纯视觉 SmolVLA JAX checkpoint。
checkpoint: /home/typhon/FRS_Tact/checkpoints/model/pick_tube_01_jax
revision: null
allow_download: false
seed: 0
jit: true
# 必须与 train_smolvla_frs/configs/train_frs.yaml 的 action_cache.model_sample_steps 一致。
num_steps: 10

# 这里描述的是基础 SmolVLA，而不是单独的 FRS 触觉输入。
# 默认从基础 checkpoint 的 config.json 自动推断；需要时可覆盖个别字段。
checkpoint_contract: {}

# 机器人观测 key -> 基础 SmolVLA checkpoint 的模型 key。
rename_map:
  observation.images.camera0: observation.images.camera1
  observation.images.camera1: observation.images.camera2

# FRS 会严格校验 decoder、触觉编码器和训练 cache 契约，然后执行：
# VLA normalized action -> source reverse -> x_base -> tactile FRS decode -> action。
frs:
  enabled: true
  steering_protection_interval_s: null
  # null = 关闭；0 = 历史预测均匀平均；数值越大越偏重最新预测。
  temporal_ensemble_coeff: null
  # 某臂 VLA XYZ 的三轴绝对值均低于该物理空间阈值（米）时，仅保留该臂 VLA XYZ。
  inactive_arm_xyz_threshold_m: 0.0002
  # 第 10/20 维夹爪宽度低于 threshold 时乘 multiplier，高于时乘 above_multiplier。
  gripper_gain:
    threshold: 0.1
    multiplier: 0.7
    above_multiplier: 1.0
  checkpoint: /home/typhon/FRS_Tact/checkpoints/frs/smolvla_frs_pick_tube_05_bimanual_best
  tactile_encoder_checkpoint: /home/typhon/FRS_Tact/checkpoints/encoder/encoder_ckpt_0809

  tactile_keys:
    - observation.images.tactile_left_0
    - observation.images.tactile_right_0
    - observation.images.tactile_left_1
    - observation.images.tactile_right_1

  # GRU 历史窗口 = action_horizon / n，n 必须整除。4 → 20/4=5。
  tactile_window_divisor: 4
  # 从当前帧往回抽帧；1 = 连续帧，3 = 每隔 2 帧取一次。
  history_stride: 3
  reverse_steps: 20
  reverse_solver: slerpflow
  decode_steps: 10
  decode_solver: fireflow

  # 防止误用另一份基础 SmolVLA。复制 checkpoint 时需保留文件 mtime（如 rsync -a）。
  verify_source_checkpoint_fingerprint: false
  # 超限会立即停止，不会静默退回未经 FRS 校验的 VLA action。
  max_normalized_action_abs: 8.0
  max_normalized_delta_rms: 4.0

connection:
  address: 127.0.0.1
  port: 26421
  add_port: true
  retry_interval_s: 1.0
  ping_interval_s: 20.0
  ping_timeout_s: 20.0
  observation_timeout_s: 30.0
  action_ack_timeout_s: 30.0
  token: null
  token_env: VB_ROBOT_TOKEN
  require_token: true

observation:
  # single-right-arm-7x10 必须配套右手 SmolVLA 与单手 FRS checkpoint。
  state_action_profile: dual-arm-20x20
  # 基础 checkpoint 是 vision，但 FRS 还需要四路原始触觉图像，因此服务端必须发 vitac。
  data_type: vitac
  language_prompt: Use the left hand to pick up the green tube, and then use the right hand to pick up the blue tube.
  single_arm_mode: false
  controlled_arm: null
  no_state_obs_mode: false

control:
  # 训练数据是 30 Hz；FRS v1 逐 action 重定向，完整协商 horizon 不截断执行。
  control_frequency: 30.0
  controller_frequency: 80.0
  action_horizon: 20
  steps_per_inference: 20
  # 当前 FRS reverse 不支持 RTC 拼接；基础 checkpoint 必须关闭 RTC。
  inference_delay: null
  execution_horizon: null

runtime:
  auto_start: false
  warmup_runs: 2
  status_interval_s: 2.0
  max_iterations: 0

logging:
  save_observations: true
  output_dir: outputs/frs_remote_observations
  save_every: 1
  queue_size: 32
