# Right-hand single-arm pure-vision SmolVLA deployment (PyTorch).
backend: pytorch_smolvla
# Must be a PyTorch checkpoint trained with 7D state and 10D action.
checkpoint: /home/typhon/FRS_Tact/checkpoints/model/smolvla_press_0903_2w
revision: null
allow_download: false
device: cuda
rename_map: {}

connection:
  address: 127.0.0.1
  port: 26421
  add_port: true
  retry_interval_s: 1.0
  ping_interval_s: 20.0
  ping_timeout_s: 20.0
  observation_timeout_s: 30.0
  action_ack_timeout_s: 30.0
  token: null
  token_env: VB_ROBOT_TOKEN
  require_token: true

observation:
  state_action_profile: single-right-arm-7x10
  data_type: vision
  task: 0
  language_prompt: Use the hand to press the button of the bread machine.
  single_arm_mode: true
  controlled_arm: right
  no_state_obs_mode: false

control:
  control_frequency: 20.0
  controller_frequency: 80.0
  action_horizon: 50
  steps_per_inference: 50

# The robot bridge remains bimanual. Disable hysteresis so the right-hand model
# controls its gripper directly while the projected left-hand command holds.
gripper:
  hysteresis_enabled: false
  left_close_threshold: 0.09
  left_reopen_threshold: 0.10
  left_closed_command: 0.01
  right_close_threshold: 0.09
  right_reopen_threshold: 0.10
  right_closed_command: 0.01

runtime:
  auto_start: false
  warmup_runs: 1
  status_interval_s: 2.0
  max_iterations: 0

logging:
  save_observations: true
  output_dir: outputs/smolvla_pytorch_right_observations
  save_every: 1
  queue_size: 32
