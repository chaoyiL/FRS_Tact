# Pure-vision SmolVLA deployment using the official PyTorch LeRobot policy.
backend: pytorch_smolvla
checkpoint: /home/typhon/FRS_Tact/checkpoints/model/smolvla_task1_0830_1.8w
revision: null
allow_download: false
device: cuda
rename_map:
  observation.images.camera0: observation.images.camera1
  observation.images.camera1: observation.images.camera2

connection:
  address: 127.0.0.1
  port: 26421
  add_port: true
  retry_interval_s: 1.0
  ping_interval_s: 20.0
  ping_timeout_s: 20.0
  observation_timeout_s: 30.0
  action_ack_timeout_s: 30.0
  token: null
  token_env: VB_ROBOT_TOKEN
  require_token: true

observation:
  state_action_profile: dual-arm-20x20
  data_type: vision
  task: 0
  language_prompt: Firstly, use the left hand to pick up the blue tube, and then use the right hand to pick up the green tube. Next, use the left hand to place the blue tube back firstly, and then use the right hand to place the green tube back.
  single_arm_mode: false
  controlled_arm: null
  no_state_obs_mode: false

control:
  control_frequency: 20.0
  controller_frequency: 80.0
  action_horizon: 20
  steps_per_inference: 10

gripper:
  hysteresis_enabled: True
  left_close_threshold: 0.09
  left_reopen_threshold: 0.10
  left_closed_command: 0.01
  right_close_threshold: 0.09
  right_reopen_threshold: 0.10
  right_closed_command: 0.01

runtime:
  auto_start: false
  warmup_runs: 2
  status_interval_s: 2.0
  max_iterations: 0

logging:
  save_observations: true
  output_dir: outputs/smolvla_pytorch_observations
  save_every: 1
  queue_size: 32
