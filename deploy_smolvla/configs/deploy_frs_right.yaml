# Right-hand single-arm SmolVLA-FRS deployment (JAX).
backend: jax_smolvla_frs
# Converted JAX checkpoint from the matching PyTorch right-hand checkpoint.
checkpoint: /home/typhon/FRS_Tact/checkpoints/model/smolvla_right_jax
revision: null
allow_download: false
seed: 0
jit: true
num_steps: 10
checkpoint_contract: {}
rename_map:
  observation.images.camera0: observation.images.camera1

frs:
  enabled: true
  checkpoint: /home/typhon/FRS_Tact/checkpoints/frs/smolvla_right_frs
  tactile_encoder_checkpoint: /home/typhon/FRS_Tact/checkpoints/encoder/encoder_ckpt
  tactile_keys:
    - observation.images.tactile_right_0
    - observation.images.tactile_right_1
  tactile_window_divisor: 4
  history_stride: 3
  reverse_steps: 20
  reverse_solver: slerpflow
  decode_steps: 10
  decode_solver: fireflow
  steering_protection_interval_s: null
  temporal_ensemble_coeff: null
  inactive_arm_xyz_threshold_m: null
  gripper_gain: null
  verify_source_checkpoint_fingerprint: false
  max_normalized_action_abs: 8.0
  max_normalized_delta_rms: 4.0

connection:
  address: 127.0.0.1
  port: 26421
  add_port: true
  retry_interval_s: 1.0
  ping_interval_s: 20.0
  ping_timeout_s: 20.0
  observation_timeout_s: 30.0
  action_ack_timeout_s: 30.0
  token: null
  token_env: VB_ROBOT_TOKEN
  require_token: true

observation:
  state_action_profile: single-right-arm-7x10
  data_type: vitac
  language_prompt: Use the right hand to complete the task.
  single_arm_mode: true
  controlled_arm: right
  no_state_obs_mode: false

control:
  control_frequency: 30.0
  controller_frequency: 80.0
  action_horizon: 20
  steps_per_inference: 20
  inference_delay: null
  execution_horizon: null

runtime:
  auto_start: false
  warmup_runs: 1
  status_interval_s: 2.0
  max_iterations: 0

logging:
  save_observations: true
  output_dir: outputs/smolvla_frs_right_observations
  save_every: 1
  queue_size: 32
