# SmolVLA JAX 远程部署配置。改这里即可切换 checkpoint / 机器人地址 / 任务指令。
# 运行:
#   bash ./deploy_smolvla/scripts/start_vtsmolvla.sh
# 仅检查 token/config，不加载模型:
#   bash ./deploy_smolvla/scripts/start_vtsmolvla.sh --check

# ---- 模型 ----
# 本地 checkpoint 目录，或 Hugging Face model id
checkpoint: /home/typhon/models/pick_tube_02_3w_jax
# 本地 checkpoint 不使用 Hugging Face revision。
revision: null
# checkpoint 和 SmolVLM tokenizer 均从本地文件/缓存加载。
allow_download: false
seed: 0
jit: true
# 可选：覆盖 Euler denoising steps；null 表示用 checkpoint 里的 num_steps
num_steps: null
# 部署端在加载模型、连接机器人之前用这份独立合约验证 checkpoint。
checkpoint_contract:
  state_dim: 20
  action_dim: 20
  chunk_size: 10
  image_keys:
    - observation.images.camera1
    - observation.images.camera2
  tactile_keys: []
  tactile_embedding_dim: 512
  tactile_num_tokens: 0
  lora_rank: 0
  vlm_lora_target_modules: []
# 机器人观测 key -> checkpoint 期望的特征名；不需要可留空 {}
rename_map: {
  observation.images.camera0: observation.images.camera1,
  observation.images.camera1: observation.images.camera2
}

# ---- 机器人连接 ----
connection:
  # 局域网: "192.168.1.10" / "ws://192.168.1.10:26421"
  # 隧道: "https://example.ngrok-free.dev"
  address: 127.0.0.1
  port: 26421
  add_port: true
  retry_interval_s: 1.0
  # 心跳用于及时发现半开连接；观测超时后客户端会停止机器人并退出。
  ping_interval_s: 20.0
  ping_timeout_s: 20.0
  observation_timeout_s: 30.0
  action_ack_timeout_s: 30.0
  # 真机认证不在仓库内保存默认值；启动前必须设置 VB_ROBOT_TOKEN。
  token: null
  token_env: VB_ROBOT_TOKEN
  require_token: true

# ---- 观测、提示词、模型类型 Vision/Tactile----
observation:
  data_type: vision
  language_prompt: Use the left hand to pick up the green tube, and then use the right hand to pick up the blue tube.
  single_arm_mode: false
  no_state_obs_mode: false

# ---- 控制 ----
control:
  control_frequency: 20.0
  controller_frequency: 80.0
  # 必须与 checkpoint.chunk_size 一致：模型每次预测 10 步 action chunk
  action_horizon: 10
  # 每次执行完整的 10 步 chunk，然后读取新视觉观测并重新规划
  steps_per_inference: 10
  # 仅当 checkpoint 开启 RTC 时使用；不设则默认用 steps_per_inference
  inference_delay: null
  execution_horizon: null

# ---- 运行时 ----
runtime:
  # false：warmup 后需按 Enter 再给机器人发 start（真机更安全）
  auto_start: false
  warmup_runs: 2
  status_interval_s: 2.0
  # 0 表示一直跑到 Ctrl+C；正数适合协议冒烟测试
  max_iterations: 0

# ---- 观测落盘（异步，不阻塞推理）----
logging:
  save_observations: true
  output_dir: outputs/vb3_remote_observations
  save_every: 1
  queue_size: 32
