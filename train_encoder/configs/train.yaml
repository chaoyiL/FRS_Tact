# Tactile encoder 对比预训练配置。改这里即可，不必手敲一长串 CLI。
# 运行:
#   uv run python -m train_encoder.train --config train_encoder/configs/train.yaml
# CLI 同名参数可覆盖 YAML（例如 --epochs 50）。

# ---- 数据集 / 输出 ----
# 每个 task 独立无放回抽取 300 条训练 episode + 35 条验证 episode。
# 同一 task 的多个 repo 先合并，再按总预算抽取；不是每个 repo 各 300 条。
# sides 使用固定传感器对应：left=camera0/tactile_*_0，right=camera1/tactile_*_1。
tasks:
  - name: pick
    dataset_repo_ids:
      - KaiyueChen/pick_01
    sides: [right]
    num_train_episodes: 300
    num_val_episodes: 35
  - name: insert
    dataset_repo_ids:
      - KaiyueChen/insert_01
    sides: [right]
    num_train_episodes: 300
    num_val_episodes: 35
  - name: bread
    dataset_repo_ids:
      - KaiyueChen/bread_03
    sides: [left, right]
    num_train_episodes: 300
    num_val_episodes: 35
  - name: two_tubes
    dataset_repo_ids:
      - KaiyueChen/two_tubes_01
    sides: [left, right]
    num_train_episodes: 300
    num_val_episodes: 35
# 先运行 bash scripts/download_encoder_data.sh；训练只读取该清单中的本地文件。
dataset_manifest: .cache/encoder_data/train300_val35/manifest.json
# 可选：写入 checkpoint metadata 的 run 标签；null = 用 repo id
config_name: four_tasks_train300_val35
output_dir: checkpoints/encoder_four_tasks_train300

# ---- CLIP / 数据键 ----
clip_model_id: openai/clip-vit-base-patch16
# 可选：用统一 RGB 键替代各腕当前相机做 mask；空字符串 = 关闭
masked_rgb_key: ""

# ---- 采样与划分 ----
future_offset: 1
frame_stride: 5
split_seed: 0
val_fraction: 0.1  # 仅旧 dataset_repo_ids 模式使用；tasks 模式使用上述显式预算
# 同 episode + 同腕、future index 在 ±window 内视为多正样本。
# null = 等于 frame_stride；0 = 仅对角线正样本
positive_temporal_window: 0

# ---- Batch / DataLoader ----
# 必须为偶数；单手任务只贡献其有效手侧，因此混合训练不强制左右各半。
batch_size: 32
clip_microbatch: 64
loader: thread          # thread | mp
num_workers: 16
pair_threads: 8         # 仅 loader=mp
pipeline_prefetch: 6
prefetch_batches: 6
image_cache_size: 1024
preload_images: false

# ---- 优化器 / 调度 ----
epochs: 40
learning_rate: 3.0e-4  # 多任务训练的保守起点，按验证集表现调整
weight_decay: 5.0e-4
grad_clip_norm: 1.0     # <=0 关闭梯度裁剪
warmup_epochs: 2
min_lr_ratio: 0.1
lr_schedule: cosine     # cosine | constant
seed: 0

# ---- RGB patch mask（仅当前帧 RGB）----
rgb_mask_patch_size: 16
rgb_mask_ratio: 0.3          # 训练 query 端 mask
eval_rgb_mask_patch_size: null  # null = 沿用 rgb_mask_patch_size
eval_rgb_mask_ratio: 0.0         # 验证/独立评估时不 mask query RGB
eval_mask_seed: 0

# ---- 对比学习扩展（默认关）----
# MoCo 式 future-RGB embedding 队列；0 = 关闭。可试 8192 / 16384
memory_bank_size: 16384
# bank 内 top-K hard neg；需 memory_bank_size>0。0 = 用全部跨 episode bank 负样本。可试 256
hard_negatives_k: 31
# 触觉历史 GRU 步数（回看步长 = frame_stride）；0 = 不用 GRU
tactile_history: 0

# ---- 验证 / 早停 / 恢复 ----
eval_every: 2
early_stop_patience: 8   # 0 = 关闭；按总 val_recall@1，单位为 epoch
# 0 = 全验证集同侧检索；>1 = 每个 query 抽一个同侧验证池：
# 1 个正样本 + pool_size-1 个负样本。例如 64 更接近固定规模候选集成功率。
retrieval_pool_size: 32
retrieval_pool_seed: 0
resume: false             # true = 从 output_dir/last 恢复
resume_from: null         # 显式 checkpoint 目录；非 null 时覆盖 resume
write_plots: true         # 每个 epoch 刷新 output_dir/training_curves.png
