# Pi0.5 FRS 右手单臂完整训练流水线。
# 固定合同：7D observation.state、10D action、右腕视觉、右手机械臂的左右两路触觉。
# 纯视觉 checkpoint 由以下命令下载到 /workspace/FRS_Tact/checkpoints/model/pi05_task3_0830_1w：
# FRS_CHECKPOINT_ROOT=/workspace/FRS_Tact/checkpoints \
#   bash scripts/download_ckpt.sh KaiyueChen/pi05_task3_0830_1w
checkpoint: /workspace/FRS_Tact/checkpoints/model/pi05_task3_0830_1w
allow_download: false

datasets:
  - repo_id: KaiyueChen/insert_01
    root: /workspace/lerobot_v30/KaiyueChen/insert_01
    action_key: action

action_cache:
  root: /workspace/frs_insert_01_pi05_right/action_cache_slerpflow_k50_state_v3
  model_sample_steps: 10
  reverse_steps: 50
  reverse_solver: slerpflow
  batch_size: 64
  load_workers: 4
  flush_every: 8
  inference_seed: 0
  split_seed: 42
  val_fraction: 0.1
  frame_stride: 5
  drop_tail_action_chunks: 1
  max_episodes: null
  max_samples: null

tactile_embedding_cache:
  enabled: true
  # 新路径避免复用曾以 tactile_right_0 + tactile_right_1 生成的错误缓存。
  root: /workspace/tactile_embeddings_pi05_right_insert_01_two_face
  dtype: float16
  precompute_batch_size: 128
  precompute_num_workers: 4
  precompute_prefetch_factor: 2
  precompute_video_backend: torchcodec
  precompute_flush_every: 20

model:
  state_action_profile: single-right-arm-7x10
  state_dim: 7
  robot_action_dim: 10
  use_tactile_encoder: true
  tactile_encoder_path: /workspace/FRS_Tact/checkpoints/encoder_ckpt_0824
  freeze_tactile_encoder: true
  tactile_keys:
    # 后缀 1 表示右机械臂，left/right 表示同一夹爪的两侧触觉。
    - observation.images.tactile_left_1
    - observation.images.tactile_right_1
  tactile_embedding_dim: 512
  tactile_num_tokens: 2
  tactile_image_size: 224
  state_conditioning: true
  state_dropout_rate: 0.1
  camera_map:
    right_wrist_0_rgb: observation.images.camera1
  # 必须与右手 Pi0.5 checkpoint 的模型 action_dim 一致。
  action_dim: 10
  action_horizon: 50
  paligemma_variant: gemma_2b_lora
  action_expert_variant: gemma_300m_lora

norm_stats:
  # 必须使用训练右手 Pi0.5 checkpoint 时的同一套 7D state / 10D action 统计量。
  dir: /workspace/FRS_Tact/checkpoints/model/pi05_task3_0830_1w/assets
  asset_id: insert_0102_train90
  use_quantile_norm: true

frs_training:
  # 新输出目录避免 resume/评估误读旧语义 checkpoint。
  # 部署一致版本：0:9 由 FRS 修复，dim 9 夹爪始终保留 VLA。
  output: /workspace/frs_insert_01_pi05_right/run_composite_gated_right_two_face_arm9_guarded_02
  tactile_window_divisor: 5
  history_stride: 3
  # 单手 composite objective：Gate 先混合 GT/VLA endpoint，再计算一条 FM 路径。
  loss_mode: composite_gated
  gate_tau: 0.4
  gate_temperature: 0.1
  aux_decode_weight: 4.0
  aux_decode_steps: 10
  aux_decode_solver: fireflow
  low_gate_safety_weight: 0.5
  low_gate_safety_margin: 0.03
  low_gate_regression_margin: 0.005
  rank_low_gate_threshold: 0.3
  rank_high_gate_threshold: 0.7
  rank_weight: 4.0
  rank_margin: 0.0
  repair_weight: 2.0
  repair_margin: 0.0
  best_max_low_gate_unsafe_frac: 0.05
  best_min_high_gate_gain: 0.0
  best_min_high_gate_rank_satisfied_frac: 0.8
  best_min_high_gate_repair_satisfied_frac: 0.8
  best_max_high_gate_harm_p95: 0.03
  best_max_low_gate_regression_frac: 0.05
  model_dim: 256
  depth: 6
  num_heads: 4
  mlp_ratio: 4
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  warmup_epochs: 2
  lr_reference_dim: 256
  min_lr_ratio: 0.1
  lr_schedule: cosine
  batch_size: 128
  # First guarded rerun: enough to compare epochs 5/10/15/20/25/30 without
  # spending another full 100-epoch run on a checkpoint that misses hard gates.
  epochs: 30
  validation_steps: 10
  eval_every: 5
  seed: 42
  write_plots: true
  resume: false
  resume_from: null
