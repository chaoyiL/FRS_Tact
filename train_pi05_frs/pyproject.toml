[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pi05-frs-training"
version = "0.1.0"
description = "Standalone Pi0.5 flow-steering training environment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7,<2.12.0",
    "torchvision>=0.22.0,<0.27.0",
    "torchcodec>=0.3.0,<0.12.0; (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')) or (sys_platform == 'darwin' and platform_machine == 'arm64')",
    "torchcodec>=0.7.0,<0.12.0; sys_platform == 'win32'",
    "torchcodec>=0.11.0,<0.12.0; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'arm64')",
    "numpy>=2.0.0,<2.3.0",
    "opencv-python-headless>=4.9.0,<4.14.0",
    "Pillow>=10.0.0,<13.0.0",
    "einops>=0.8.0,<0.9.0",
    "draccus==0.10.0",
    "datasets>=4.7.0,<5.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pyarrow>=21.0.0,<30.0.0",
    "av>=15.0.0,<16.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "matplotlib>=3.10.3,<4.0.0",
    "pytest>=8.0.0,<10.0.0",
    "transformers==4.53.2",
    "jax[cuda12-local]==0.5.3",
    "jaxlib==0.5.3",
    "nvidia-cuda-nvcc-cu12>=12.8,<13; sys_platform == 'linux'",
    "flax==0.10.2",
    "optax>=0.2.5,<0.3.0",
    "orbax-checkpoint==0.11.13",
    "ml-dtypes==0.4.1",
    "augmax>=0.3.4",
    "beartype==0.19.0",
    "chex==0.1.90",
    "etils[epath]>=1.11.0",
    "filelock>=3.16.1",
    "fsspec[gcs]>=2024.6.0",
    "huggingface-hub>=0.34.0,<1.0.0",
    "jaxtyping==0.2.36",
    "jsonlines>=4.0.0,<5.0.0",
    "msgpack>=1.0.0,<2.0.0",
    "numpydantic>=1.6.6",
    "packaging>=24.2,<26.0",
    "pydantic>=2.0.0",
    "requests>=2.32.0,<3.0.0",
    "safetensors>=0.4.3,<1.0.0",
    "sentencepiece>=0.2.0",
    "setuptools>=71.0.0,<81.0.0",
    "termcolor>=2.4.0,<4.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "tqdm-loggable>=0.2",
    "tyro>=0.9.5",
    "typing-extensions>=4.12.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.setuptools.packages.find]
where = ["src", ".."]
include = ["train_pi05_frs*", "lerobot*"]
