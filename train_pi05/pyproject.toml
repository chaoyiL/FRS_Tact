[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# 兼容旧锁文件或下游临时添加的固定 Git 依赖。当前训练项目已经内置所需的
# LeRobot v3 读取代码，本身不再依赖 GitHub 上的 LeRobot。
allow-direct-references = true

[project]
name = "pi05-vision-training"
version = "0.1.0"
description = "Standalone pure-vision JAX pi0.5 fine-tuning"
requires-python = ">=3.11,<3.12"
dependencies = [
    "augmax>=0.3.4",
    "av>=15.0.0,<16.0.0",
    "beartype==0.19.0",
    "chex",
    "dm-tree>=0.1.8",
    "draccus==0.10.0",
    "datasets>=4.7.0,<5.0.0",
    "einops>=0.8.0",
    "etils[epath]",
    "filelock>=3.16.1",
    "flax==0.10.2",
    "fsspec>=2024.6.0,<2026.0.0",
    "gcsfs>=2024.6.0,<2026.0.0",
    "huggingface-hub",
    "jax[cuda12]==0.5.3; sys_platform == 'linux'",
    "jax==0.5.3; sys_platform != 'linux'",
    "jaxtyping==0.2.36",
    "jsonlines>=4.0.0,<5.0.0",
    "ml-collections==1.0.0",
    "msgpack>=1.0.5",
    "numpy>=1.22.4,<2.0.0",
    "numpydantic>=1.6.6",
    "opencv-python==4.11.0.86",
    "optax",
    "orbax-checkpoint==0.11.13",
    "pillow>=11.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pyarrow>=21.0.0,<30.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "pydantic>=2.0",
    "pynvml>=12.0.0",
    "pytest>=8.3.4",
    "requests>=2.32.0,<3.0.0",
    "safetensors",
    "sentencepiece>=0.2.0",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchcodec>=0.7.0,<0.12.0; sys_platform == 'win32'",
    "torchcodec>=0.3.0,<0.12.0; sys_platform == 'linux'",
    "tqdm>=4.66.0",
    "tqdm-loggable>=0.2",
    "transformers==4.53.2",
    "treescope>=0.1.7",
    "typing-extensions>=4.12.2",
    "tyro>=0.9.5",
    "wandb>=0.19.1",
    "websockets>=11.0",
]

[dependency-groups]
dev = ["ruff>=0.8.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/openpi", "src/openpi_client", "src/lerobot", "tools"]

[tool.uv]
override-dependencies = ["ml-dtypes==0.4.1", "tensorstore==0.1.74"]

[[tool.uv.index]]
# Pi0.5 使用 JAX 访问 GPU；PyTorch 只负责 LeRobot 数据加载和视频解码，
# 使用 CPU wheel 可避免重复下载数 GB 的 CUDA/NVIDIA 运行库。
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["src/openpi"]
markers = ["manual: should be run manually"]

[tool.ruff]
line-length = 120
target-version = "py311"
