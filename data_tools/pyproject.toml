[project]
name = "frs-lerobot-data-tools"
version = "0.1.0"
description = "Python 3.12 environment for Hugging Face download and LeRobot v2.1 to v3.0 conversion"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=15.0.0,<16.0.0",
    "datasets>=4.7.0,<5.0.0",
    "draccus==0.10.0",
    "huggingface-hub>=0.34.0,<1.0.0",
    "einops>=0.8.0,<0.9.0",
    "jsonlines>=4.0.0,<5.0.0",
    "numpy>=2.0.0,<2.3.0",
    "opencv-python-headless>=4.9.0,<4.14.0",
    "packaging>=24.2,<26.0",
    "pandas>=2.0.0,<3.0.0",
    "pillow>=10.0.0,<13.0.0",
    "pyarrow>=21.0.0,<30.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "requests>=2.32.0,<3.0.0",
    "safetensors>=0.4.3,<1.0.0",
    "termcolor>=2.4.0,<4.0.0",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "tqdm>=4.66.0,<5.0.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
