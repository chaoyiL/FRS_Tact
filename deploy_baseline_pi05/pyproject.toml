[build-system]
requires = ["setuptools>=71.0.0,<81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pi05-direct-baseline-deployment"
version = "0.1.0"
description = "Standalone visual Pi0.5 deployment with a direct tactile action decoder"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7,<2.12.0",
    "numpy>=2.0.0,<2.3.0",
    "opencv-python-headless>=4.9.0,<4.14.0",
    "einops>=0.8.0,<0.9.0",
    "PyYAML>=6.0.0,<7.0.0",
    "msgpack>=1.0.0,<2.0.0",
    "websockets>=13.0,<16.0",
    "safetensors>=0.4.3,<1.0.0",
    "setuptools>=71.0.0,<81.0.0",
    "transformers==4.53.2",
    "jax[cuda12-local]==0.5.3",
    "jax-cuda12-plugin==0.5.3; sys_platform == 'linux'",
    "jax-cuda12-pjrt==0.5.3; sys_platform == 'linux'",
    "jaxlib==0.5.3",
    "nvidia-cuda-nvcc-cu12>=12.8,<13; sys_platform == 'linux'",
    "flax==0.10.2",
    "orbax-checkpoint==0.11.13",
    "ml-dtypes==0.4.1",
    "augmax>=0.3.4",
    "beartype==0.19.0",
    "jaxtyping==0.2.36",
    "sentencepiece>=0.2.0",
    "filelock>=3.16.1",
    "fsspec[gcs]>=2024.6.0",
    "tqdm-loggable>=0.2",
    "chex==0.1.90",
    "numpydantic>=1.6.6",
    "pydantic>=2.0.0",
    "typing-extensions>=4.12.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.setuptools]
packages = [
    "deploy_baseline_pi05",
    "deploy_baseline_pi05.tactile_runtime",
    "lerobot",
    "lerobot.policies",
    "lerobot.policies.pi05_jax",
    "lerobot.policies.pi05_jax.policies",
    "lerobot.policies.pi05_jax.utils",
]
include-package-data = true

[tool.setuptools.package-dir]
deploy_baseline_pi05 = "."
lerobot = "src/lerobot"

[tool.setuptools.package-data]
deploy_baseline_pi05 = ["configs/*.yaml"]
