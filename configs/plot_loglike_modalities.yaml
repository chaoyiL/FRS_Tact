# Reverse 模态 log-likelihood 消融绘图配置。
# 运行:
#   uv run python -m modalities_eval.plot_loglike_modalities --config configs/plot_loglike_modalities.yaml
# CLI 同名参数可覆盖 YAML。

# ---- 数据 / episode ----
data:
  checkpoint_dir: /home/rvsa/codehub/FRS_Tact/checkpoints/tactile_test_L32_4k
  dataset_repo_id: chaoyi/tactile_test_05
  dataset_root: null
  dataset_revision: null
  action_key: null
  # JSON 对象字符串，或 YAML mapping（加载时会转成 JSON 字符串）
  rename_map: null
  allow_download: false
  episode_index: 100
  frame: 0
  max_frames: 400
  sample_interval: 5
  single_frame: false

# ---- 积分 / 迭代 ----
integration:
  num_steps: 50
  ode_solver: fireflow   # euler | fireflow | slerpflow
  eval_batch_size: 4
  hutchinson_samples: 1
  hutchinson_seed: 0

# ---- reverse：plot_loglike_modalities.py ----
reverse:
  modalities:
    - vision
    - state
    - language_prompt
  output_dir: eval_outputs/loglike
  y_field: contribution
  output_path: null
