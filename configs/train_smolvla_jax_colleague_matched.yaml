# JAX SmolVLA configuration aligned with the colleague's successful run.
# Intentional differences: use only datasets 01-04, chunk_size=20,
# n_action_steps=10, and BF16 compute as required by this JAX backend.

checkpoint: lerobot/smolvla_base
revision: null
allow_download: true
full_vlm_checkpoint: HuggingFaceTB/SmolVLM2-500M-Video-Instruct

datasets:
  - repo_id: KaiyueChen/pick_tube_01
    root: /DATA/ljl/substage/lerobot_v30/KaiyueChen/pick_tube_01
    action_key: actions
    weight: 1.0
    rename_map:
      observation.images.camera0: observation.images.camera1
      observation.images.camera1: observation.images.camera2
  - repo_id: KaiyueChen/pick_tube_02
    root: /DATA/ljl/substage/lerobot_v30/KaiyueChen/pick_tube_02
    action_key: actions
    weight: 1.0
    rename_map:
      observation.images.camera0: observation.images.camera1
      observation.images.camera1: observation.images.camera2
  - repo_id: KaiyueChen/pick_tube_03
    root: /DATA/ljl/substage/lerobot_v30/KaiyueChen/pick_tube_03
    action_key: actions
    weight: 1.0
    rename_map:
      observation.images.camera0: observation.images.camera1
      observation.images.camera1: observation.images.camera2
  - repo_id: KaiyueChen/pick_tube_04
    root: /DATA/ljl/substage/lerobot_v30/KaiyueChen/pick_tube_04
    action_key: actions
    weight: 1.0
    rename_map:
      observation.images.camera0: observation.images.camera1
      observation.images.camera1: observation.images.camera2

# Keep split/statistics isolated from the existing six-dataset protocol.
normalization:
  protocol_dir: /DATA/ljl/substage/normalization_protocols/pick_tube_01_04_visual_colleague_matched

tactile_embedding_cache:
  enabled: false

# Online augmentation must see the original images, so vision caching is off.
offline_training_cache:
  enabled: false

output: /DATA/ljl/substage/outputs/smolvla_visual_colleague_matched_4datasets
steps: 40000
batch_size: 32
num_workers: 8
prefetch_factor: 4
video_backend: torchcodec
return_uint8: false
log_freq: 20
save_freq: 5000
eval_freq: 500
seed: 1000
resume: null
data_parallel: true
allow_tokenizer_download: true

image_transforms:
  enable: true
  max_num_transforms: 2
  random_order: false
  tfs:
    brightness:
      weight: 1.0
      type: ColorJitter
      kwargs:
        brightness: [0.8, 1.2]
    contrast:
      weight: 1.0
      type: ColorJitter
      kwargs:
        contrast: [0.8, 1.2]
    saturation:
      weight: 1.0
      type: ColorJitter
      kwargs:
        saturation: [0.85, 1.15]
    hue:
      weight: 0.5
      type: ColorJitter
      kwargs:
        hue: [-0.01, 0.01]
    sharpness:
      weight: 0.5
      type: SharpnessJitter
      kwargs:
        sharpness: [0.8, 1.2]

modality_dropout:
  enable: false

validation:
  enabled: true
  fraction: 0.1
  seed: 1000
  sample_seed: 1001
  rollout: true
  max_batches: null

wandb:
  enabled: true
  project: pick_tube
  entity: null
  name: smolvla_jax_colleague_matched_4datasets
  group: smolvla_jax_colleague_matched
  tags: [smolvla, jax, visual, colleague_matched, datasets_01_04]
  notes: "Colleague-matched JAX run on datasets 01-04; chunk=20, action steps=10."
  mode: online

model:
  trainable_compute_dtype: bfloat16
  module_modes:
    vision: frozen
    connector: frozen
    vlm_text: lora
    expert: full
    action: full
    state_proj: full
  lora_rank: 16
  lora_alpha: 16.0
  vlm_lora_target_modules:
    - q_proj
    - v_proj
  action_dim: 20
  state_dim: 20
  max_action_dim: 32
  max_state_dim: 32
  image_keys:
    - observation.images.camera1
    - observation.images.camera2
  empty_cameras: 0
  use_tactile_encoder: false
  chunk_size: 20
  n_action_steps: 10
  num_vlm_layers: 16
  num_expert_layers: -1
  self_attn_every_n_layers: 2
  attention_mode: cross_attn
  expert_width_multiplier: 0.75
  optimizer_lr: 1.0e-4
  optimizer_beta1: 0.9
  optimizer_beta2: 0.95
  optimizer_eps: 1.0e-8
  optimizer_weight_decay: 1.0e-10
  optimizer_grad_clip_norm: 10.0
  scheduler_warmup_steps: 2000
  scheduler_decay_steps: 40000
  scheduler_decay_lr: 2.5e-6
