# 视觉 + 触觉 encoder 版 SmolVLA JAX 微调配置。
# 这个文件和 train_smolvla_jax.yaml 分开；后者保留为纯视觉基线配置。
# 运行：
#   FRS_TMUX_SESSION=vtsmolvla_tactile32 bash scripts/start_vtsmolvla_train.sh \
#     --config configs/train_vtsmolvla_jax_tactile32.yaml

# ---- 预训练权重 ----
checkpoint: lerobot/smolvla_base
revision: null
allow_download: true
# 仅当 num_vlm_layers 超过 SmolVLA checkpoint 已有层数时，用这个完整 VLM checkpoint 补齐缺失层。
full_vlm_checkpoint: HuggingFaceTB/SmolVLM2-500M-Video-Instruct

# ---- 数据集 ----
# 触觉图像和 RGB/state/action 来自同一个 LeRobot 数据集。
datasets:
  - repo_id: KaiyueChen/pick_tube_01
    root: /DATA/ljl/substage/lerobot_v30/KaiyueChen/pick_tube_01
    action_key: actions
    weight: 1.0
    rename_map:
      observation.images.camera0: observation.images.camera1
      observation.images.camera1: observation.images.camera2

  - repo_id: KaiyueChen/pick_tube_02
    root: /DATA/ljl/substage/lerobot_v30/KaiyueChen/pick_tube_02
    action_key: actions
    weight: 1.0
    rename_map:
      observation.images.camera0: observation.images.camera1
      observation.images.camera1: observation.images.camera2

  - repo_id: KaiyueChen/pick_tube_03
    root: /DATA/ljl/substage/lerobot_v30/KaiyueChen/pick_tube_03
    action_key: actions
    weight: 1.0
    rename_map:
      observation.images.camera0: observation.images.camera1
      observation.images.camera1: observation.images.camera2

  - repo_id: KaiyueChen/pick_tube_04
    root: /DATA/ljl/substage/lerobot_v30/KaiyueChen/pick_tube_04
    action_key: actions
    weight: 1.0
    rename_map:
      observation.images.camera0: observation.images.camera1
      observation.images.camera1: observation.images.camera2

  - repo_id: KaiyueChen/pick_tube_05
    root: /DATA/ljl/substage/lerobot_v30/KaiyueChen/pick_tube_05
    action_key: actions
    weight: 1.0
    rename_map:
      observation.images.camera0: observation.images.camera1
      observation.images.camera1: observation.images.camera2

  - repo_id: KaiyueChen/pick_tube_06
    root: /DATA/ljl/substage/lerobot_v30/KaiyueChen/pick_tube_06
    action_key: actions
    weight: 1.0
    rename_map:
      observation.images.camera0: observation.images.camera1
      observation.images.camera1: observation.images.camera2

# ---- 共享的 train-only normalization 协议 ----
# K8/K21 必须复用同一个非 output 目录；已有内容只能严格校验，不能覆盖。
normalization:
  protocol_dir: /DATA/ljl/substage/normalization_protocols/pick_tube_01_06_vt_k8_k21

# ---- 触觉 embedding 缓存 ----
# 首次训练前运行一次：
#   uv run --no-sync python tools/precompute_tactile_embeddings.py \
#     --config configs/train_vtsmolvla_jax.yaml
# 缓存覆盖数据集中的所有帧；训练时只解码两路 RGB，不再解码四路触觉视频或重复运行 ResNet18。
# 每帧保存原始 [4, 512] ResNet 特征，当前 VT 使用当前帧，后续 FRS 可按帧索引组成 history。
tactile_embedding_cache:
  enabled: true
  root: /DATA/ljl/substage/tactile_embeddings
  # 容量随六个数据集的总帧数增长；模型投影前会转回 float32 并做 RMS normalization。
  dtype: float16
  # 以下参数只控制首次预计算，不影响正式训练超参。
  precompute_batch_size: 128
  precompute_num_workers: 4
  precompute_prefetch_factor: 2
  precompute_video_backend: torchcodec
  precompute_flush_every: 20

# ---- 冻结视觉 token 的离线训练缓存 ----
offline_training_cache:
  enabled: true
  root: /DATA/ljl/substage/smolvla_training_cache
  dtype: bfloat16
  precompute_batch_size: 64
  precompute_num_workers: 8
  loader_num_workers: 2
  host_prefetch_batches: 2

# ---- 输出与训练超参 ----
output: /DATA/ljl/substage/outputs/vtsmolvla_tactile_repeat32
steps: 40000
batch_size: 64
# 8 核 RunPod：每个 worker 内还会并行解码六路视频，避免开过多进程。
num_workers: 2
prefetch_factor: 4
# TorchCodec 通常比 PyAV 更适合多路视频随机帧读取。
video_backend: torchcodec
# worker 间传 uint8，避免六路图像提前膨胀为 4 倍大小的 float32。
return_uint8: true
log_freq: 10
save_freq: 5000
eval_freq: 500
seed: 42
resume: null
data_parallel: true
allow_tokenizer_download: true

# ---- 图像增强 ----
# 仅对 model.image_keys 中的 RGB 图像生效，触觉图像保持原始分布。
image_transforms:
  enable: false
  # 与 VB3 训练一致：每张 RGB 图像按 weight 无放回抽取 2 种增强。
  max_num_transforms: 2
  random_order: false
  tfs:
    brightness:
      weight: 1.0
      type: ColorJitter
      kwargs:
        brightness: [0.8, 1.2]
    contrast:
      weight: 1.0
      type: ColorJitter
      kwargs:
        contrast: [0.8, 1.2]
    saturation:
      weight: 1.0
      type: ColorJitter
      kwargs:
        saturation: [0.85, 1.15]
    hue:
      weight: 0.5
      type: ColorJitter
      kwargs:
        hue: [-0.01, 0.01]
    sharpness:
      weight: 0.5
      type: SharpnessJitter
      kwargs:
        sharpness: [0.8, 1.2]

# ---- 模态 dropout ----
# 第一版先保守一些。触觉融合验证通过后，再加专门针对触觉 token 的 dropout；
# 不把触觉 token 当作普通相机处理。
modality_dropout:
  enable: false
  every_n_steps: 10
  prob: 1.0
  drop_language: true
  drop_state: false
  camera_indices: [0, 1]

# ---- Flow-matching 验证 ----
validation:
  enabled: true
  fraction: 0.1
  # 与训练 seed 解耦；每次验证复用相同的 flow-matching 与 rollout 噪声。
  seed: 20240805
  # 只在首次创建 data_split.json 时使用，固定抽取覆盖所有数据集的验证帧。
  sample_seed: 20240806
  rollout: true
  rollout_steps: null
  max_batches: 5

# ---- Weights & Biases ----
wandb:
  enabled: true
  project: smolvla-jax
  entity: null
  name: vtsmolvla_tactile_repeat32
  mode: online
  tags: [smolvla, tactile, tactile-encoder, vtsmolvla, naive-repeat, tactile32]
  log_checkpoints: false

# ---- 模型配置覆盖 ----
# RGB 仍然走 SmolVLA 原本的视觉分支。触觉图像不要加入 image_keys；
# 它们会先经过冻结的 tactile encoder，再作为 tactile tokens 融合进模型。
model:
  # 每个模块选择一种训练模式：frozen | full | lora。
  # tactile_proj 是新增的融合投影层：把 tactile encoder embedding 投到 SmolVLA hidden space。
  module_modes:
    vision: frozen
    # 与 VB3 PEFT 设置一致：视觉 encoder 和 connector 都冻结。
    connector: frozen
    vlm_text: lora
    expert: full
    action: full
    state_proj: full
    tactile_proj: full
  lora_rank: 16
  lora_alpha: 16.0
  # 只微调 VLM self-attention 的 Q/V。
  vlm_lora_target_modules:
    - q_proj
    - v_proj

  action_dim: 20
  state_dim: 20
  max_action_dim: 32
  max_state_dim: 32

  # 每个数据集应用 rename_map 后的纯视觉相机 keys。
  image_keys:
    - observation.images.camera1
    - observation.images.camera2
  empty_cameras: 0

  # ---- 触觉 encoder ----
  # 只复用当前帧的 ResNet backbone；不加载 checkpoint 中可能存在的 GRU/history 分支。
  use_tactile_encoder: true
  tactile_encoder_path: /DATA/ljl/substage/checkpoints/encoder_ckpt_05
  freeze_tactile_encoder: true
  tactile_keys:
    - observation.images.tactile_left_0
    - observation.images.tactile_right_0
    - observation.images.tactile_left_1
    - observation.images.tactile_right_1
  tactile_embedding_dim: 512
  tactile_num_tokens: 4
  # 每路 projected tactile token 的无参数复制数；1 为原始四-token baseline。
  tactile_token_repeat_factor: 21
  tactile_image_size: 224

  chunk_size: 20
  n_action_steps: 5

  # ---- VLM / expert 架构 ----
  num_vlm_layers: 16
  num_expert_layers: -1
  self_attn_every_n_layers: 2
  attention_mode: cross_attn
  expert_width_multiplier: 0.75

  optimizer_lr: 5.0e-5
  optimizer_weight_decay: 1.0e-4
  optimizer_grad_clip_norm: 10.0
  scheduler_warmup_steps: 1000
  scheduler_decay_steps: 40000
