[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "deco-deployment"
version = "0.1.0"
description = "Standalone DECO TorchScript robot bridge deployment"
requires-python = ">=3.10,<3.14"
dependencies = [
  "torch>=2.7,<2.12",
  "numpy>=1.26,<2.3",
  "PyYAML>=6,<7",
  "msgpack>=1,<2",
  "websockets>=13,<16",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
