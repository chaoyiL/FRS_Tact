# 四个 pick_tube 数据集上的触觉 Flow Steering 训练配置。
# 完整管线：
#   1) uv run --no-sync python tools/merge_smolvla_peft_to_jax.py \
#        --adapter KaiyueChen/pick_tube_02_3w \
#        --base lerobot/smolvla_base \
#        --output /workspace/checkpoints/pick_tube_02_3w_jax
#   2) uv run --no-sync python -m train_frs.compare_frs_reverse_solvers \
#        --config train_frs/configs/train_frs.yaml
#   3) uv run --no-sync python tools/precompute_tactile_embeddings.py \
#        --config train_frs/configs/train_frs.yaml
#   4) uv run --no-sync python -m train_frs.prepare_frs_caches \
#        --config train_frs/configs/train_frs.yaml
#   5) uv run --no-sync python -m train_frs.train_frs \
#        --config train_frs/configs/train_frs.yaml

# 合并 PEFT adapter 后的完整 JAX SmolVLA checkpoint。
checkpoint: /workspace/checkpoints/pick_tube_02_3w_jax
# checkpoint 本身是本地目录；true 只允许首次补齐 tokenizer 等公共资源。
allow_download: true

#自动下载冻结的smovla ckpt
checkpoint_merge:
  adapter: KaiyueChen/pick_tube_02_3w
  base: lerobot/smolvla_base
  output: /workspace/checkpoints/pick_tube_02_3w_jax
  allow_download: true

datasets:
  - repo_id: KaiyueChen/pick_tube_01
    root: /workspace/lerobot_v30/KaiyueChen/pick_tube_01
    action_key: actions
    rename_map: &camera_rename
      observation.images.camera0: observation.images.camera1
      observation.images.camera1: observation.images.camera2

  - repo_id: KaiyueChen/pick_tube_02
    root: /workspace/lerobot_v30/KaiyueChen/pick_tube_02
    action_key: actions
    rename_map: *camera_rename

  - repo_id: KaiyueChen/pick_tube_03
    root: /workspace/lerobot_v30/KaiyueChen/pick_tube_03
    action_key: actions
    rename_map: *camera_rename

  - repo_id: KaiyueChen/pick_tube_04
    root: /workspace/lerobot_v30/KaiyueChen/pick_tube_04
    action_key: actions
    rename_map: *camera_rename

# SmolVLA 预测、反向积分 latent 和 GT action。每个数据集写独立子目录。
action_cache:
  root: /workspace/frs_pick_tube/action_cache_slerpflow
  model_sample_steps: 10
  reverse_steps: 20
  reverse_solver: slerpflow
  # H100 aggressive cache pipeline: 8 spawn workers decode/prefetch RGB while
  # the GPU processes a 64-sample SmolVLA + SlerpFlow batch.
  batch_size: 64
  num_workers: 8
  prefetch_factor: 2
  video_backend: torchcodec
  worker_timeout_seconds: 300
  # Keep the durable resume interval at 128 samples (2 * batch_size).
  flush_every: 2
  inference_seed: 0
  split_seed: 42
  val_fraction: 0.1
  # 30Hz 数据相邻帧高度相关；stride=5 将约 51 万帧压到约 10 万训练样本。
  frame_stride: 5
  drop_tail_action_chunks: 1
  max_episodes: null
  max_samples: null

# 在生成完整 action cache 前，用相同样本和 seed 比较 FireFlow/SlerpFlow。
reverse_solver_ab:
  enabled: false
  root: /workspace/frs_pick_tube/reverse_solver_ab_k20
  max_samples_per_dataset: 512
  max_episodes: null
  # SlerpFlow 全局 mean inversion MSE 不得高于 FireFlow。
  max_mean_ratio: 1.0

# 每帧保存四路 frozen ResNet embedding [4, 512]；FRS 训练不再解码触觉视频。
tactile_embedding_cache:
  enabled: true
  root: /workspace/tactile_embeddings
  dtype: float16
  precompute_batch_size: 128
  precompute_num_workers: 4
  precompute_prefetch_factor: 2
  precompute_video_backend: torchcodec
  precompute_flush_every: 20

# 这里只供 tactile embedding 预计算和 FRS loader 做一致性校验。
model:
  use_tactile_encoder: true
  tactile_encoder_path: /workspace/checkpoints/encoder_ckpt_06
  freeze_tactile_encoder: true
  tactile_keys:
    - observation.images.tactile_left_0
    - observation.images.tactile_right_0
    - observation.images.tactile_left_1
    - observation.images.tactile_right_1
  tactile_embedding_dim: 512
  tactile_num_tokens: 4
  tactile_image_size: 224

frs_training:
  # Explicit gate_w conditioning changes the decoder parameter tree; keep this
  # experiment separate from checkpoints trained with the hidden gate label.
  output: /workspace/frs_pick_tube/run_gated_slerpflow_rankw10_repairw20_tau020_k20
  # checkpoint chunk_size=10，因此 tactile_window=10/1=10。
  tactile_window_divisor: 1
  # 10 个 token 每隔 3 帧回看一次，在 30Hz 下覆盖约 0.9 秒。
  history_stride: 3

  # 正式目标：接触变化明显时向 GT steering，未接触时保持 SmolVLA。
  loss_mode: gated
  gate_tau: 0.2
  gate_temperature: 0.1
  gate_lambda: 1.0
  aux_decode_weight: 1.0
  aux_decode_steps: 10
  # 高 w 强制 decode 更靠近 GT；低 w 强制 decode 更靠近原始 VLA。
  rank_weight: 1.0
  rank_margin: 0.01
  # 高 w 还必须比原始 VLA→GT baseline 至少降低 0.01 MSE，避免只靠远离 VLA。
  repair_weight: 2.0
  repair_margin: 0.01

  model_dim: 256
  depth: 6
  num_heads: 4
  mlp_ratio: 4
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  warmup_epochs: 2
  lr_reference_dim: 256
  min_lr_ratio: 0.1
  lr_schedule: cosine

  batch_size: 128
  epochs: 100
  validation_steps: 10
  eval_every: 5
  seed: 42
  write_plots: true
  # auto：last/ 存在就续训，否则冷启动；适合整条管线安全重跑。
  resume: auto
  resume_from: null
