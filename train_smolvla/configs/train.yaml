# SmolVLA JAX 微调配置。改这里即可，不必手改 Hugging Face cache 里的 config.json。
# 运行:
#   uv run python -m train_smolvla.train --config train_smolvla/configs/train.yaml

# ---- 预训练权重 ----
checkpoint: lerobot/smolvla_base
revision: null
allow_download: false
# num_vlm_layers 超过 checkpoint 自带层数时，从这里按需下载并补齐缺失 VLM 层；HF cache 已有则直接复用
full_vlm_checkpoint: HuggingFaceTB/SmolVLM2-500M-Video-Instruct

# ---- 数据集 ----
# 写一个或多个均可；每个条目可有独立 root / action_key / rename_map / weight
datasets:
  - repo_id: lerobot/aloha_sim_insertion_human
    action_key: action
    weight: 1.0
    rename_map:
      observation.images.cam_high: observation.images.camera1
      observation.images.cam_low: observation.images.camera2
  # - repo_id: lerobot/aloha_sim_transfer_cube_human
  #   action_key: action
  #   weight: 1.0
  #   rename_map:
  #     observation.images.cam_high: observation.images.camera1
  #     observation.images.cam_low: observation.images.camera2

# ---- 输出与训练超参 ----
output: train_smolvla/outputs/checkpoints
steps: 60000
batch_size: 192          # 全局 batch，多卡时必须能被 GPU 数整除
num_workers: 16
prefetch_factor: 4
video_backend: null
return_uint8: true
log_freq: 10
save_freq: 5000
eval_freq: 500       # 每隔多少 step 跑一次验证（也在最后一步跑）
seed: 42
resume: null
data_parallel: true
allow_tokenizer_download: false

# ---- 启动器 ----
launcher:
  tmux_session: smolvla_train
  foreground: false
  logs_dir: train_smolvla/outputs/logs

# ---- 图像增强（仅训练集；验证集始终关闭）----
# enable: false 可关闭。省略 tfs 则用下方默认 brightness/contrast/saturation/hue/sharpness/affine。
image_transforms:
  enable: true
  max_num_transforms: 5   # 每帧最多随机抽几种增强
  random_order: false
  # tfs:
  #   brightness:
  #     weight: 1.0
  #     type: ColorJitter
  #     kwargs:
  #       brightness: [0.8, 1.2]
  #   contrast:
  #     weight: 1.0
  #     type: ColorJitter
  #     kwargs:
  #       contrast: [0.8, 1.2]
  #   saturation:
  #     weight: 1.0
  #     type: ColorJitter
  #     kwargs:
  #       saturation: [0.5, 1.5]
  #   hue:
  #     weight: 1.0
  #     type: ColorJitter
  #     kwargs:
  #       hue: [-0.05, 0.05]
  #   sharpness:
  #     weight: 1.0
  #     type: SharpnessJitter
  #     kwargs:
  #       sharpness: [0.5, 1.5]
  #   affine:
  #     weight: 1.0
  #     type: RandomAffine
  #     kwargs:
  #       degrees: [-5.0, 5.0]
  #       translate: [0.05, 0.05]

# ---- Modality dropout（仅训练；验证/推理不启用）----
# 每 every_n_steps 步，以 prob 概率随机 drop 掉一种模态（通过 attn/pad mask）。
# 可选模态：每个相机、language；drop_state 默认关（state 对动作很关键）。
modality_dropout:
  enable: true
  every_n_steps: 10
  prob: 1.0
  drop_language: true
  drop_state: true
  # camera_indices: [0, 1]   # null/省略 = 所有相机；可指定只 drop 部分相机

# ---- Flow-matching 验证集 ----
# 按 episode 划分；验证时计算 FM loss，并可选做 action-chunk rollout（sample_actions）后与 GT 比 MSE。
validation:
  enabled: true
  fraction: 0.1          # 每个数据集抽出的 episode 比例
  rollout: true          # true: 额外做 FM 积分采样（rollout）
  rollout_steps: null    # null = 用 model.num_steps；可改成更小以加速验证
  max_batches: 5      # null = 跑完整验证集；可设正整数做快速抽检

# ---- Weights & Biases ----
wandb:
  enabled: true
  project: smolvla-jax
  entity: null          # 可选：你的 team / username
  name: smolvla_visual_baseline
  mode: online          # online | offline | disabled
  tags:
    - smolvla
    - visual
  log_checkpoints: false

# ---- 覆盖 checkpoint 的模型配置（对应原 config.json）----
# 数据集 actions / observation.state 是 20 维；base 权重默认是 6 维。
model:
  # 每个模块必须选择一种模式：frozen | full | lora
  # lora 只作用于该模块的 Linear；Conv / Embedding / Norm 保持冻结。
  module_modes:
    vision: frozen
    connector: full
    vlm_text: frozen
    expert: full
    action: full
    state_proj: full
  lora_rank: 8
  lora_alpha: 16.0

  action_dim: 14
  state_dim: 14
  max_action_dim: 32
  max_state_dim: 32
  # 与 rename_map 之后的相机名对齐；数量通常保持与预训练一致（3 路）
  image_keys:
    - observation.images.camera1
    - observation.images.camera2
  chunk_size: 50
  n_action_steps: 50
  # image_keys 里缺的相机，最多用几路空图（mask=0）补齐；训练/部署共用，写进 checkpoint
  empty_cameras: 1

  # ---- VLM / Expert 架构维度（覆盖 checkpoint；改这里即可）----
  # 1~16 直接使用 SmolVLA 权重；17~32 自动从 full_vlm_checkpoint 补齐缺失层
  num_vlm_layers: 16
  # -1 为自动：在 checkpoint 可用范围内选择能整除 VLM 层数的最大 expert 层数（32层时为16）
  num_expert_layers: -1
  self_attn_every_n_layers: 2
  attention_mode: cross_attn     # cross_attn | self_attn
  # expert 隐层宽 = text_hidden_size * expert_width_multiplier（改宽度会与预训练 expert 权重 shape 不匹配）
  expert_width_multiplier: 0.75
  # text_hidden_size: 960         # 一般保持与预训练 VLM 一致，勿随意改
  # text_intermediate_size: 2560
  # expert_hidden_size / expert_intermediate_size 默认由上面两项自动推导；如需可显式覆盖

  optimizer_lr: 5.0e-5
  optimizer_weight_decay: 1.0e-4   # AdamW weight decay；可加大抗过拟合（如 1e-4 ~ 1e-2）
  optimizer_grad_clip_norm: 10.0
  scheduler_warmup_steps: 1000
  scheduler_decay_steps: 60000
