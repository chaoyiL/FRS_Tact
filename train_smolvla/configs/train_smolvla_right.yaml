# Pure-vision SmolVLA training for the right hand.
# Canonical model contract: 7D state, 10D action, one right-wrist camera.

dataset:
  expected_fps: 30
  state_dim: 7
  action_dim: 10
  # Every source below is canonicalized to this model-facing key.
  image_keys:
    - observation.images.camera1
  eval_split: 0.10
  # The local balanced-light-v2 augmenter is used instead.
  image_transforms:
    enable: false
    max_num_transforms: 0
    random_order: false
    tfs: {}

# insert_01 stores its active single-hand RGB stream in camera0, while
# insert_02 stores it in camera1 and keeps camera0 as a black placeholder.
# Per-source renaming makes both datasets expose the same canonical camera1.
datasets:
  - repo_id: KaiyueChen/insert_01
    root: /workspace/lerobot_v30/KaiyueChen/insert_01
    rename_map:
      observation.images.camera0: observation.images.camera1

  - repo_id: KaiyueChen/insert_02
    root: /workspace/lerobot_v30/KaiyueChen/insert_02

augmentation:
  preset: balanced-light-v2
  enabled: true

policy:
  path: lerobot/smolvla_base
  chunk_size: 20
  n_action_steps: 10
  empty_cameras: 0
  num_vlm_layers: 16
  num_expert_layers: 16
  freeze_vision_encoder: true
  train_expert_only: false
  train_state_proj: true
  optimizer_lr: 5.0e-5
  scheduler_warmup_steps: 500
  scheduler_decay_steps: 6000
  device: cuda
  push_to_hub: false

# Source-specific camera renaming above has already produced the final model
# key, so no additional global rename is required.
rename_map: {}

peft:
  enable: true
  method_type: LORA
  target_modules: 'model\.vlm_with_expert\.vlm\.model\.text_model\.layers\..*\.self_attn\.(q|v)_proj'
  full_training_modules:
    - model.vlm_with_expert.lm_expert
    - model.state_proj
    - model.action_in_proj
    - model.action_out_proj
    - model.action_time_mlp_in
    - model.action_time_mlp_out
  rank: 16
  lora_alpha: 16

training:
  output_dir: /workspace/outputs/smolvla_right_insert_0102
  existing_output: increment
  job_name: smolvla_right_insert_0102
  # Per-GPU value: two GPUs produce a global batch of 128.
  batch_size: 64
  num_workers: 8
  # Start with roughly a few epochs and select the best validation checkpoint;
  # the previous 30k default is unnecessarily prone to overfitting here.
  steps: 20000
  eval_steps: 1000
  max_eval_samples: 2560
  save_freq: 500
  log_freq: 20
  seed: 42
  resume_from: null

distributed:
  num_gpus: 2
  num_machines: 1
  mixed_precision: bf16
  timeout_seconds: 7200

wandb:
  enable: true
  project: smolvla-right
  entity: null
  mode: auto
  notes: SmolVLA right-hand insert_01+insert_02, 7D state, 10D action, one RGB camera
  run_id: null
  disable_artifact: true
  add_tags: true
