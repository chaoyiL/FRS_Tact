# RTX 4090 单卡 SmolVLA 全链路冒烟测试。
# 保持正式双臂模型合同，只缩小 batch、worker 和训练步数。

dataset:
  expected_fps: 30
  state_dim: 20
  action_dim: 20
  image_keys:
    - observation.images.camera0
    - observation.images.camera1
  # 冒烟测试只验证训练与 checkpoint 链路，不运行耗时的完整验证集。
  eval_split: 0.0
  image_transforms:
    enable: false
    max_num_transforms: 0
    random_order: false
    tfs: {}

datasets:
  - repo_id: KaiyueChen/two_tubes_04
    root: /workspace/lerobot_v30/KaiyueChen/two_tubes_04

augmentation:
  preset: balanced-light-v2
  enabled: true

policy:
  path: lerobot/smolvla_base
  chunk_size: 20
  n_action_steps: 10
  empty_cameras: 0
  num_vlm_layers: 16
  num_expert_layers: 16
  freeze_vision_encoder: true
  train_expert_only: false
  train_state_proj: true
  optimizer_lr: 5.0e-5
  scheduler_warmup_steps: 1
  scheduler_decay_steps: 5
  device: cuda
  push_to_hub: false

rename_map:
  observation.images.camera0: observation.images.camera1
  observation.images.camera1: observation.images.camera2

peft:
  enable: true
  method_type: LORA
  target_modules: 'model\.vlm_with_expert\.vlm\.model\.text_model\.layers\..*\.self_attn\.(q|v)_proj'
  full_training_modules:
    - model.vlm_with_expert.lm_expert
    - model.state_proj
    - model.action_in_proj
    - model.action_out_proj
    - model.action_time_mlp_in
    - model.action_time_mlp_out
  rank: 16
  lora_alpha: 16

training:
  output_dir: /workspace/outputs/smolvla_4090_smoke
  existing_output: increment
  job_name: smolvla_4090_smoke
  batch_size: 1
  num_workers: 2
  steps: 5
  eval_steps: 0
  max_eval_samples: 0
  save_freq: 5
  log_freq: 1
  seed: 1000
  resume_from: null

distributed:
  num_gpus: 1
  num_machines: 1
  mixed_precision: bf16
  timeout_seconds: 7200

wandb:
  enable: false
  project: smolvla-4090-smoke
  entity: null
  mode: disabled
  notes: RTX 4090 single-GPU end-to-end smoke test
  run_id: null
  disable_artifact: true
  add_tags: false
