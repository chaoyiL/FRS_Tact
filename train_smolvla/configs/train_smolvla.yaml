# Pure-vision SmolVLA training for the dual-arm two-tubes task.
# Canonical model contract: 20D state, 20D action, two RGB cameras.

dataset:
  expected_fps: 30
  state_dim: 20
  action_dim: 20
  # Raw dataset camera keys. Extra tactile image streams are intentionally ignored.
  image_keys:
    - observation.images.camera0
    - observation.images.camera1
  eval_split: 0.10
  # The local balanced-light-v2 augmenter is used instead.
  image_transforms:
    enable: false
    max_num_transforms: 2
    random_order: false
    tfs:
      brightness:
        weight: 1.0
        type: ColorJitter
        kwargs:
          brightness: [0.8, 1.2]
      contrast:
        weight: 1.0
        type: ColorJitter
        kwargs:
          contrast: [0.8, 1.2]
      saturation:
        weight: 1.0
        type: ColorJitter
        kwargs:
          saturation: [0.85, 1.15]
      hue:
        weight: 0.5
        type: ColorJitter
        kwargs:
          hue: [-0.01, 0.01]
      sharpness:
        weight: 0.5
        type: SharpnessJitter
        kwargs:
          sharpness: [0.8, 1.2]

# Sources are split into train/eval episodes independently, then concatenated.
# With no explicit weights, frame sampling is proportional to source size.
datasets:
  - repo_id: KaiyueChen/two_tubes_01
    root: /workspace/lerobot_v30/KaiyueChen/two_tubes_01

  - repo_id: KaiyueChen/two_tubes_02
    root: /workspace/lerobot_v30/KaiyueChen/two_tubes_02

  - repo_id: KaiyueChen/two_tubes_03
    root: /workspace/lerobot_v30/KaiyueChen/two_tubes_03

  - repo_id: KaiyueChen/two_tubes_04
    root: /workspace/lerobot_v30/KaiyueChen/two_tubes_04

# One shared transform draw is applied to both RGB cameras in each sample.
augmentation:
  preset: balanced-light-v2
  enabled: true

policy:
  path: lerobot/smolvla_base
  # Predict 50 future actions, but re-plan after executing 10 actions.
  chunk_size: 50
  n_action_steps: 10
  empty_cameras: 0
  num_vlm_layers: 16
  num_expert_layers: 16
  freeze_vision_encoder: true
  train_expert_only: false
  train_state_proj: true
  optimizer_lr: 5.0e-5
  scheduler_warmup_steps: 1500
  scheduler_decay_steps: 30000
  device: cuda
  push_to_hub: false

# Map the two raw RGB streams to SmolVLA's model-facing camera names.
rename_map:
  observation.images.camera0: observation.images.camera1
  observation.images.camera1: observation.images.camera2

peft:
  enable: true
  method_type: LORA
  target_modules: 'model\.vlm_with_expert\.vlm\.model\.text_model\.layers\..*\.self_attn\.(q|v)_proj'
  full_training_modules:
    - model.vlm_with_expert.lm_expert
    - model.state_proj
    - model.action_in_proj
    - model.action_out_proj
    - model.action_time_mlp_in
    - model.action_time_mlp_out
  rank: 16
  lora_alpha: 16

training:
  # Use a fresh name so horizon-20 and horizon-50 checkpoints cannot be confused.
  output_dir: /workspace/outputs/smolvla_two_tubes_0104_h50
  existing_output: increment
  job_name: smolvla_two_tubes_0104_h50
  # Per-GPU value: two GPUs produce a global batch of 128.
  batch_size: 64
  num_workers: 8
  steps: 30000
  eval_steps: 2000
  max_eval_samples: 0
  save_freq: 2000
  log_freq: 20
  seed: 1000
  resume_from: null

distributed:
  num_gpus: 2
  num_machines: 1
  mixed_precision: bf16
  timeout_seconds: 7200

wandb:
  enable: true
  project: smolvla-two-tubes
  entity: null
  mode: auto
  notes: SmolVLA dual-arm two_tubes_01-04, horizon 50, re-plan every 10 actions
  run_id: null
  disable_artifact: true
  add_tags: true
