# 纯视觉 SmolVLA 双臂训练配置，字段与官方 LeRobot 训练流程对齐。
# 启动：bash train_smolvla/scripts/start_smolvla_train.sh

dataset:
  # 数据必须先通过 scripts/download_data.sh 下载并转换为 LeRobot v3.0。
  expected_fps: 30
  state_dim: 20
  action_dim: 20
  image_keys:
    - observation.images.camera0
    - observation.images.camera1
  eval_split: 0.10
  # SmolVLA balanced-light-v2 is applied jointly at batch level below. Keep the
  # per-camera LeRobot transforms disabled to avoid double augmentation and
  # independent random parameters for the two views.
  image_transforms:
    enable: false
    max_num_transforms: 2
    random_order: false
    tfs:
      brightness:
        weight: 1.0
        type: ColorJitter
        kwargs:
          brightness: [0.8, 1.2]
      contrast:
        weight: 1.0
        type: ColorJitter
        kwargs:
          contrast: [0.8, 1.2]
      saturation:
        weight: 1.0
        type: ColorJitter
        kwargs:
          saturation: [0.85, 1.15]
      hue:
        weight: 0.5
        type: ColorJitter
        kwargs:
          hue: [-0.01, 0.01]
      sharpness:
        weight: 0.5
        type: SharpnessJitter
        kwargs:
          sharpness: [0.8, 1.2]

# Add one entry per LeRobot v3.0 source. Training splits each source into
# train/eval episodes, concatenates them, and globally shuffles all frames.
# Without explicit weights, sampling is proportional to each source's frames.
datasets:
  - repo_id: KaiyueChen/two_tubes_01
    root: /workspace/lerobot_v30/KaiyueChen/two_tubes_01

  - repo_id: KaiyueChen/two_tubes_02
    root: /workspace/lerobot_v30/KaiyueChen/two_tubes_02

  - repo_id: KaiyueChen/two_tubes_03
    root: /workspace/lerobot_v30/KaiyueChen/two_tubes_03

  - repo_id: KaiyueChen/two_tubes_04
    root: /workspace/lerobot_v30/KaiyueChen/two_tubes_04

  - repo_id: KaiyueChen/two_tubes_05
    root: /workspace/lerobot_v30/KaiyueChen/two_tubes_05

# SmolVLA balanced-light-v2, calibrated from the reference recipe:
# 25% identity and 75% mild brightness/contrast/saturation jitter, with one shared draw for both cameras
# in each sample. Non-identity samples have a 20% blur probability.
augmentation:
  preset: balanced-light-v2
  enabled: true

policy:
  path: lerobot/smolvla_base
  chunk_size: 20
  n_action_steps: 10
  empty_cameras: 0
  num_vlm_layers: 16
  num_expert_layers: 16
  freeze_vision_encoder: true
  train_expert_only: false
  train_state_proj: true
  optimizer_lr: 5.0e-5
  scheduler_warmup_steps: 1500
  scheduler_decay_steps: 30000
  device: cuda
  push_to_hub: false

# 与数据中的相机键对应；双臂配置把左右腕相机统一成模型的 camera1/camera2。
rename_map:
  observation.images.camera0: observation.images.camera1
  observation.images.camera1: observation.images.camera2

# FRS_Tact 混合微调方式：VLM 注意力使用 LoRA，动作专家和动作投影完整训练。
peft:
  enable: true
  method_type: LORA
  target_modules: 'model\.vlm_with_expert\.vlm\.model\.text_model\.layers\..*\.self_attn\.(q|v)_proj'
  full_training_modules:
    - model.vlm_with_expert.lm_expert
    - model.state_proj
    - model.action_in_proj
    - model.action_out_proj
    - model.action_time_mlp_in
    - model.action_time_mlp_out
  rank: 16
  lora_alpha: 16

training:
  output_dir: /workspace/outputs/smolvla_task1
  # Preserve an existing/failed run and choose a timestamped directory.
  existing_output: increment
  job_name: smolvla_task1
  # batch_size 和 num_workers 均为每张 GPU 的数值。
  batch_size: 64
  num_workers: 8
  steps: 30000
  eval_steps: 500
  max_eval_samples: 0
  save_freq: 2000
  log_freq: 20
  seed: 1000
  # 填写完整 checkpoint 的 pretrained_model/train_config.json；新训练保持 null。
  resume_from: null

distributed:
  num_gpus: 2
  num_machines: 1
  mixed_precision: bf16
  # LeRobot lets rank 0 prepare all local datasets before rank 1. Five datasets
  # can exceed Accelerate/NCCL's 600-second default on network-backed storage.
  timeout_seconds: 7200

wandb:
  enable: true
  project: smolvla-task1
  entity: null
  # auto: online when WANDB_API_KEY/~/.netrc exists, otherwise offline.
  mode: auto
  notes: PyTorch SmolVLA pure-vision dual-arm training
  run_id: null
  disable_artifact: true
  add_tags: true
