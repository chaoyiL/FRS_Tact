#pi05 checkpoint for FRS deployment
checkpoint: /workspace/checkpoints/pi05_pick_tube_lora/10000
seed: 0
num_steps: 10

model:
  # pi0.5 works in 32D; only the first 20 dimensions are sent to the robot.
  action_dim: 32
  action_horizon: 50
  state_dim: 20
  robot_action_dim: 20
  paligemma_variant: gemma_2b_lora
  action_expert_variant: gemma_300m_lora

  # pi0.5 slot -> raw robot observation key.
  camera_map:
    left_wrist_0_rgb: observation.images.camera0
    right_wrist_0_rgb: observation.images.camera1
  # The robot has no base camera. Keep the slot explicit in the saved config.
  empty_cameras:
    - base_0_rgb

norm_stats:
  dir: /workspace/checkpoints/pi05_pick_tube_lora/10000/assets
  asset_id: pick_tube
  use_quantile_norm: true

frs:
  enabled: true
  checkpoint: /workspace/frs_pick_tube_pi05/run_gated_v7_state_01/best
  tactile_encoder_checkpoint: /workspace/checkpoints/encoder_ckpt_0809
  tactile_keys:
    - observation.images.tactile_left_0
    - observation.images.tactile_right_0
    - observation.images.tactile_left_1
    - observation.images.tactile_right_1

  tactile_window_divisor: 5
  history_stride: 3
  reverse_steps: 50
  reverse_solver: slerpflow
  decode_steps: 10
  decode_solver: fireflow

  steering_protection_interval_s: null
  temporal_ensemble_coeff: 0.1
  gripper_gain:
    threshold: 0.1
    gain: 0.05
  verify_source_checkpoint_fingerprint: false
  max_normalized_action_abs: 8.0
  max_normalized_delta_rms: 4.0

connection:
  address: 127.0.0.1
  port: 26421
  add_port: true
  retry_interval_s: 1.0
  ping_interval_s: 20.0
  ping_timeout_s: 20.0
  observation_timeout_s: 30.0
  action_ack_timeout_s: 30.0
  token: null
  token_env: VB_ROBOT_TOKEN
  require_token: true

observation:
  data_type: vitac
  language_prompt: Use the left hand to pick up the green tube, and then use the right hand to pick up the blue tube.
  single_arm_mode: false
  no_state_obs_mode: false

control:
  control_frequency: 20.0
  controller_frequency: 80.0
  action_horizon: 50
  steps_per_inference: 50

runtime:
  auto_start: false
  warmup_runs: 2
  max_iterations: 0

logging:
  save_observations: true
  output_dir: outputs/pi05_frs_observations
  save_every: 1
  queue_size: 32
