# Plain-vision pi0.5 deployment configuration.
checkpoint: /home/typhon/ManiSkill-vitac/checkpoints/6000/
seed: 0
num_steps: 10

model:
  # The selected legacy pi05_bi checkpoint was trained with 20D model actions.
  action_dim: 20
  action_horizon: 50
  state_dim: 20
  robot_action_dim: 20
  paligemma_variant: gemma_2b_lora
  action_expert_variant: gemma_300m_lora
  camera_map:
    left_wrist_0_rgb: observation.images.camera0
    right_wrist_0_rgb: observation.images.camera1
  empty_cameras: []

norm_stats:
  dir: /home/typhon/ManiSkill-vitac/checkpoints/6000/assets
  asset_id: pick_tube_all
  use_quantile_norm: true

connection:
  address: 127.0.0.1
  port: 26421
  add_port: true
  retry_interval_s: 1.0
  ping_interval_s: 20.0
  ping_timeout_s: 20.0
  observation_timeout_s: 30.0
  action_ack_timeout_s: 30.0
  token: null
  token_env: VB_ROBOT_TOKEN
  require_token: true

observation:
  data_type: vision
  language_prompt: Use the left hand to pick up the green tube, and then use the right hand to pick up the blue tube.
  single_arm_mode: false
  no_state_obs_mode: false

control:
  control_frequency: 10.0
  controller_frequency: 80.0
  action_horizon: 50
  steps_per_inference: 50

runtime:
  auto_start: false
  warmup_runs: 1
  max_iterations: 0

logging:
  save_observations: true
  output_dir: outputs/pi05_observations
  save_every: 1
  queue_size: 32
