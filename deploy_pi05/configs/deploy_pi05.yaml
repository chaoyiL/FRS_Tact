# Plain-vision pi0.5 deployment configuration.
checkpoint: /home/typhon/FRS_Tact/checkpoints/model/pi05_bi_two_tubes_0102_step16000/checkpoint
seed: 0
num_steps: 10

model:
  # The selected legacy pi05_bi checkpoint was trained with 20D model actions.
  action_dim: 20
  action_horizon: 50
  state_dim: 20
  robot_action_dim: 20
  paligemma_variant: gemma_2b_lora
  action_expert_variant: gemma_300m_lora
  camera_map:
    left_wrist_0_rgb: observation.images.camera0
    right_wrist_0_rgb: observation.images.camera1
  empty_cameras: []

norm_stats:
  dir: /home/typhon/FRS_Tact/checkpoints/model/pi05_bi_two_tubes_0102_step16000/checkpoint/assets/
  asset_id: two_tubes_0102
  use_quantile_norm: true

connection:
  address: 127.0.0.1
  port: 26421
  add_port: true
  retry_interval_s: 1.0
  ping_interval_s: 20.0
  ping_timeout_s: 20.0
  observation_timeout_s: 30.0
  action_ack_timeout_s: 30.0
  token: null
  token_env: VB_ROBOT_TOKEN
  require_token: true

observation:
  data_type: vision
  language_prompt: Firstly, use the left hand to pick up the blue tube, and then use the right hand to pick up the green tube. Next, use the left hand to place the blue tube back firstly, and then use the right hand to place the green tube back.
  #Use the left hand to pick up the green tube, and then use the right hand to pick up the blue tube.
  #Firstly, use the left hand to pick up the blue tube, and then use the right hand to pick up the green tube. Next, use the left hand to place the blue tube back firstly, and then use the right hand to place the green tube back.
  single_arm_mode: false
  no_state_obs_mode: false

control:
  control_frequency: 10.0
  controller_frequency: 80.0
  action_horizon: 50
  steps_per_inference: 50
  # Reject one unsafe model chunk and immediately re-infer while holding position.
  # Stop the policy safely only after this many consecutive unsafe chunks.
  max_consecutive_unsafe_chunks: 3

gripper:
  hysteresis_enabled: true
  # VLA <= 0.08 locks the left gripper closed through return noise.
  # Reopening is allowed only once the VLA width reaches 0.10.
  left_close_threshold: 0.08
  left_reopen_threshold: 0.10
  left_closed_command: 0.01

  # VLA 预测宽度 <= 0.09：右夹爪指令强制为 0.01
  # 预测处于 0.09～0.10：保持当前闭合状态，防止抖动
  # 预测 >= 0.10：解除闭合锁存，恢复 VLA 原始宽度
  right_close_threshold: 0.09
  right_reopen_threshold: 0.10
  right_closed_command: 0.01

runtime:
  auto_start: false
  warmup_runs: 1
  max_iterations: 0

logging:
  save_observations: true
  output_dir: outputs/0825_check_frs
  save_every: 1
  queue_size: 32
