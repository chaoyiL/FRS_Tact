# Plain-vision pi0.5 deployment configuration.
checkpoint: /home/typhon/FRS_Tact/checkpoints/model/pi05_task1_0902_6k
seed: 0
num_steps: 10

# 0: direct model control, 1: tube-extraction guard, 2: bread-and-ketchup squeeze guard.
task: 0
task1:
  max_world_xy_deviation_m: 0.005
  left_release_height_m: 0.10
  right_release_height_m: 0.04
  hold_left_during_right_lift: true
  approach_translation_gain: 1.2
  translation_gain: 1.5
  rotation_gain: 1.0
  left_min_lift_height_m: 0.10
  left_lift_speed_m_s: 0.04
  right_preclose_forward_m: 0.005
  right_preclose_speed_m_s: 0.02
  right_preclose_tolerance_m: 0.001
  right_preclose_stable_steps: 3
task2:
  right_release_drop_m: 0.01
  right_release_speed_m_s: 0.01
  left_grasp_command_m: 0.022
  left_squeeze_command_m: 0.012
  left_grasp_speed_m_s: 0.008
  left_squeeze_speed_m_s: 0.003
  left_grasp_tolerance_m: 0.002
  right_release_open_threshold_m: 0.025
  toast_offset_from_right_release_xyz_m: [0.0, 0.0, 0.08]
  toast_xy_tolerance_m: 0.05
  toast_z_tolerance_m: 0.03
  left_squeeze_vla_threshold: 0.04
  hold_pose_while_closing: true
  right_lift_height_m: 0.05
  right_left_shift_m: 0.2
  right_motion_speed_m_s: 0.08
  right_pose_tolerance_m: 0.005
  right_home_tolerance_m: 0.01
  right_home_rotation_tolerance_rad: 0.1
  right_grasp_tolerance_m: 0.003

model:
  # 改为 single-right-arm-7x10 时必须同时使用 7D state / 10D action 的右手 checkpoint。
  state_action_profile: dual-arm-20x20
  # The selected legacy pi05_bi checkpoint was trained with 20D model actions.
  action_dim: 20
  action_horizon: 50
  state_dim: 20
  robot_action_dim: 20
  paligemma_variant: gemma_2b_lora
  action_expert_variant: gemma_300m_lora
  camera_map:
    left_wrist_0_rgb: observation.images.camera0
    right_wrist_0_rgb: observation.images.camera1
  empty_cameras: []

norm_stats:
  dir: /home/typhon/FRS_Tact/checkpoints/model/pi05_task1_0902_6k/assets/
  asset_id: pick_0102
  use_quantile_norm: true

connection:
  address: 127.0.0.1
  port: 26421
  add_port: true
  retry_interval_s: 1.0
  ping_interval_s: 20.0
  ping_timeout_s: 20.0
  observation_timeout_s: 30.0
  action_ack_timeout_s: 30.0
  token: null
  token_env: VB_ROBOT_TOKEN
  require_token: true

observation:
  data_type: vision
  language_prompt: Firstly, use the left hand to pick up the blue tube, and then use the right hand to pick up the green tube.
  #Firstly, use the right hand to pick up the bread and put it on the table. Secondly, use the left hand to pick up the ketchup and squeeze it onto the bread.
  #Use the left hand to pick up the green tube, and then use the right hand to pick up the blue tube.
  #Firstly, use the left hand to pick up the blue tube, and then use the right hand to pick up the green tube. Next, use the left hand to place the blue tube back firstly, and then use the right hand to place the green tube back.
  single_arm_mode: false
  controlled_arm: null
  no_state_obs_mode: false

control:
  control_frequency: 10.0
  controller_frequency: 80.0
  action_horizon: 50
  steps_per_inference: 30
  # Reject one unsafe model chunk and immediately re-infer while holding position.
  # Stop the policy safely only after this many consecutive unsafe chunks.
  max_consecutive_unsafe_chunks: 3

gripper:
  hysteresis_enabled: True
  # VLA <= 0.09 locks the left gripper closed through return noise.
  # Reopening is allowed only once the VLA width reaches 0.10.
  left_close_threshold: 0.09
  left_reopen_threshold: 0.10
  left_closed_command: 0.01

  # VLA 预测宽度 <= 0.09：右夹爪指令强制为 0.01
  # 预测处于 0.09～0.10：保持当前闭合状态，防止抖动
  # 预测 >= 0.10：解除闭合锁存，恢复 VLA 原始宽度
  right_close_threshold: 0.09
  right_reopen_threshold: 0.10
  right_closed_command: 0.01

runtime:
  auto_start: false
  warmup_runs: 1
  max_iterations: 0

logging:
  save_observations: true
  output_dir: outputs/0825_check_frs
  save_every: 1
  queue_size: 32
