# Right-hand single-arm Pi0.5 + FRS deployment.
# Required contracts:
#   robot state: 7D right arm
#   robot action: 10D right arm
#   tactile inputs: left_1, right_1 (right-hand faces, in this exact order)

# Right-hand Pi0.5 checkpoint used to build the FRS action cache.
checkpoint: /home/typhon/FRS_Tact/checkpoints/model/pi05_task3_0830_1w
seed: 0
num_steps: 10

# Existing task-specific motion guards are bimanual.
task: 0

model:
  state_action_profile: single-right-arm-7x10

  # Must match the model action dimension used while training the Pi0.5 checkpoint.
  # Use 20 or 32 instead if the checkpoint uses that padded model dimension.
  action_dim: 10
  action_horizon: 50

  # Fixed physical right-arm contract.
  state_dim: 7
  robot_action_dim: 10

  paligemma_variant: gemma_2b_lora
  action_expert_variant: gemma_300m_lora
  camera_map:
    right_wrist_0_rgb: observation.images.camera1
  empty_cameras: []

norm_stats:
  # Assets produced by the same right-hand Pi0.5 fine-tune.
  dir: /home/typhon/FRS_Tact/checkpoints/model/pi05_task3_0830_1w/assets
  asset_id: insert_0102_train90
  use_quantile_norm: true

frs:
  enabled: true

  # Uploaded arm9 epoch-10 baseline. The runtime guards below make low-Gate
  # execution exactly VLA and clamp all remaining arm residuals.
  checkpoint: /home/typhon/FRS_Tact/checkpoints/model/pi05_frs_insert_01_right_two_face_learned_residual_v3
  # TODO: replace with the tactile encoder used to train that FRS checkpoint.
  tactile_encoder_checkpoint: /home/typhon/FRS_Tact/checkpoints/encoder/encoder_ckpt_0824

  # Suffix 1 selects the right arm; left/right select the two tactile faces.
  tactile_keys:
    - observation.images.tactile_left_1
    - observation.images.tactile_right_1

  # 50 action steps / divisor 5 = tactile history window 10.
  tactile_window_divisor: 5
  history_stride: 3

  reverse_steps: 50
  reverse_solver: slerpflow
  decode_steps: 10
  decode_solver: fireflow

  steering_protection_interval_s: null
  temporal_ensemble_coeff: 0.1
  gripper_gain: null

  verify_source_checkpoint_fingerprint: false
  max_normalized_action_abs: 8.0
  max_normalized_delta_rms: 4.0
  # Exactly preserve VLA in the training-defined low-Gate region; otherwise
  # bound every arm residual while retaining the original VLA gripper action.
  hard_low_gate_bypass: true
  max_normalized_residual_abs: 0.5

connection:
  address: 127.0.0.1
  port: 26421
  add_port: true
  retry_interval_s: 1.0
  ping_interval_s: 20.0
  ping_timeout_s: 20.0
  observation_timeout_s: 30.0
  action_ack_timeout_s: 30.0
  token: null
  token_env: VB_ROBOT_TOKEN
  require_token: true

observation:
  data_type: vitac
  language_prompt: Firstly, use the hand to pick up the tube and then insert it back.
  single_arm_mode: true
  controlled_arm: right
  no_state_obs_mode: false

control:
  control_frequency: 10.0
  controller_frequency: 80.0
  action_horizon: 50
  # FRS steering executes the complete negotiated horizon.
  steps_per_inference: 50

# Disable server-side snap/hysteresis so the gripper is driven continuously by
# the original VLA output; normal hardware calibration and safety clipping remain.
# Thresholds stay as validated fallback values for profiles that enable hysteresis.
gripper:
  hysteresis_enabled: false
  left_close_threshold: 0.08
  left_reopen_threshold: 0.10
  left_closed_command: 0.01
  right_close_threshold: 0.105
  right_reopen_threshold: 0.115
  right_closed_command: 0.01

runtime:
  # The operator must confirm before START is sent.
  auto_start: false
  warmup_runs: 1
  status_interval_s: 2.0
  # 0 runs until Ctrl+C. Prefer --max-iterations 1 for the first hardware test.
  max_iterations: 0

logging:
  save_observations: true
  output_dir: outputs/pi05_frs_right_observations
  save_every: 1
  queue_size: 32
