# Right-hand single-arm, plain-vision Pi0.5 deployment.
# This profile requires a checkpoint trained with 7D right-arm state and 10D robot actions.

# Right-hand Pi0.5 checkpoint trained on insert_01.
checkpoint: /home/typhon/FRS_Tact/checkpoints/model/pi05_task3_0830_1w
seed: 0
num_steps: 10

# Existing task-specific guards are bimanual. Single-arm deployment must use task 0.
task: 0

model:
  state_action_profile: single-right-arm-7x10

  # Must match the model action dimension used while training the checkpoint.
  # Use 20 or 32 instead if the checkpoint was trained with that padded model dimension.
  action_dim: 10
  action_horizon: 50

  # Fixed physical right-arm contract.
  state_dim: 7
  robot_action_dim: 10

  paligemma_variant: gemma_2b_lora
  action_expert_variant: gemma_300m_lora
  camera_map:
    right_wrist_0_rgb: observation.images.camera1
  empty_cameras: []

norm_stats:
  # Assets produced by the same right-hand fine-tune.
  dir: /home/typhon/FRS_Tact/checkpoints/model/pi05_task3_0830_1w/assets
  asset_id: insert_0102_train90
  use_quantile_norm: true

connection:
  address: 127.0.0.1
  port: 26421
  add_port: true
  retry_interval_s: 1.0
  ping_interval_s: 20.0
  ping_timeout_s: 20.0
  observation_timeout_s: 30.0
  action_ack_timeout_s: 30.0
  token: null
  token_env: VB_ROBOT_TOKEN
  require_token: true

observation:
  data_type: vision
  language_prompt: Firstly, use the hand to pick up the tube and then insert it back.
  single_arm_mode: true
  controlled_arm: right
  no_state_obs_mode: false

control:
  control_frequency: 10.0
  controller_frequency: 80.0
  action_horizon: 50
  steps_per_inference: 50
  max_consecutive_unsafe_chunks: 3

# The bimanual wire server requires a complete gripper contract. Task 0 keeps
# hysteresis disabled so the right-hand model controls its gripper directly.
gripper:
  hysteresis_enabled: false
  left_close_threshold: 0.09
  left_reopen_threshold: 0.10
  left_closed_command: 0.01
  right_close_threshold: 0.09
  right_reopen_threshold: 0.10
  right_closed_command: 0.01

runtime:
  # Keep manual confirmation enabled for the first hardware runs.
  auto_start: false
  warmup_runs: 1
  status_interval_s: 2.0
  # 0 runs until Ctrl+C. Prefer --max-iterations 1 for the first test.
  max_iterations: 0

logging:
  save_observations: true
  output_dir: outputs/pi05_right_observations
  save_every: 1
  queue_size: 32
