# Right-hand single-arm, plain-vision Pi0.5 deployment.
# This profile requires a checkpoint trained with 7D right-arm state and 10D robot actions.

# TODO: replace with the right-hand Pi0.5 checkpoint.
checkpoint: /home/typhon/FRS_Tact/checkpoints/model/pi05_right/checkpoint
seed: 0
num_steps: 10

# Existing task-specific guards are bimanual. Single-arm deployment must use task 0.
task: 0

model:
  state_action_profile: single-right-arm-7x10

  # Must match the model action dimension used while training the checkpoint.
  # Use 20 or 32 instead if the checkpoint was trained with that padded model dimension.
  action_dim: 10
  action_horizon: 50

  # Fixed physical right-arm contract.
  state_dim: 7
  robot_action_dim: 10

  paligemma_variant: gemma_2b_lora
  action_expert_variant: gemma_300m_lora
  camera_map:
    left_wrist_0_rgb: observation.images.camera0
    right_wrist_0_rgb: observation.images.camera1
  empty_cameras: []

norm_stats:
  # TODO: replace both values with the assets produced by the same right-hand fine-tune.
  dir: /home/typhon/FRS_Tact/checkpoints/model/pi05_right/checkpoint/assets
  asset_id: insert_01
  use_quantile_norm: true

connection:
  address: 127.0.0.1
  port: 26421
  add_port: true
  retry_interval_s: 1.0
  ping_interval_s: 20.0
  ping_timeout_s: 20.0
  observation_timeout_s: 30.0
  action_ack_timeout_s: 30.0
  token: null
  token_env: VB_ROBOT_TOKEN
  require_token: true

observation:
  data_type: vision
  language_prompt: Use the right hand to complete the task.
  single_arm_mode: true
  controlled_arm: right
  no_state_obs_mode: false

control:
  control_frequency: 10.0
  controller_frequency: 80.0
  action_horizon: 50
  steps_per_inference: 50

runtime:
  # Keep manual confirmation enabled for the first hardware runs.
  auto_start: false
  warmup_runs: 1
  status_interval_s: 2.0
  # 0 runs until Ctrl+C. Prefer --max-iterations 1 for the first test.
  max_iterations: 0

logging:
  save_observations: true
  output_dir: outputs/pi05_right_observations
  save_every: 1
  queue_size: 32
