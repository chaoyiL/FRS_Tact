# Pi0.5 + FRS deployment configuration.
checkpoint: /home/typhon/FRS_Tact/checkpoints/model/pi05_bi_two_tubes_0102_step16000/checkpoint
seed: 0
num_steps: 10

# Task-specific deployment switch.
# 0: generic PI0.5 + FRS behavior
# 1: tube extraction guard (VLA translation after grasp; world XY bounded during lift)
task: 1
task1:
  # Maximum lateral distance from the grasp-time XY anchor during extraction.
  max_world_xy_deviation_m: 0.005
  # Each arm releases its XY extraction guard after this much actual world-Z lift.
  left_release_height_m: 0.10
  right_release_height_m: 0.04
  # The left arm waits at its current pose while the right tube is extracted.
  hold_left_during_right_lift: true
  # Applied only after that arm's gripper latch switches translation to VLA.
  approach_translation_gain: 1.2
  right_approach_translation_gain: 1.5

  translation_gain: 1.5
  rotation_gain: 1.0
  # Task 1 motion stages consumed by the robot-side sequencer.
  left_min_lift_height_m: 0.10
  left_lift_speed_m_s: 0.04
  right_preclose_forward_m: 0.01
  right_approach_min_open_m: 0.045
  right_preclose_speed_m_s: 0.01
  right_preclose_tolerance_m: 0.001
  right_preclose_stable_steps: 3

model:
  # 改为 single-right-arm-7x10 时必须同时使用配套的右手 Pi0.5 与 FRS checkpoint。
  state_action_profile: dual-arm-20x20
  action_dim: 20
  action_horizon: 50
  state_dim: 20
  robot_action_dim: 20
  paligemma_variant: gemma_2b_lora
  action_expert_variant: gemma_300m_lora
  camera_map:
    left_wrist_0_rgb: observation.images.camera0
    right_wrist_0_rgb: observation.images.camera1
  empty_cameras: []

norm_stats:
  dir: /home/typhon/FRS_Tact/checkpoints/model/pi05_bi_two_tubes_0102_step16000/checkpoint/assets
  asset_id: two_tubes_0102
  use_quantile_norm: true

frs:
  enabled: true
  checkpoint: /home/typhon/FRS_Tact/checkpoints/frs/pi05_frs_two_tubes_03_gate065_repair2_epoch30
  tactile_encoder_checkpoint: /home/typhon/FRS_Tact/checkpoints/encoder/encoder_ckpt_0824
  tactile_keys:
    - observation.images.tactile_left_0
    - observation.images.tactile_right_0
    - observation.images.tactile_left_1
    - observation.images.tactile_right_1
  # Training contract: action_horizon 50 / divisor 5 = tactile window 10.
  tactile_window_divisor: 5
  history_stride: 3
  reverse_steps: 50
  reverse_solver: slerpflow
  decode_steps: 10
  decode_solver: fireflow
  steering_protection_interval_s: null
  temporal_ensemble_coeff: 0.1
  # Parsed for legacy checkpoint compatibility, but PI0.5 VLA owns grippers 9/19.
  gripper_gain: null
  verify_source_checkpoint_fingerprint: false
  max_normalized_action_abs: 8.0
  max_normalized_delta_rms: 4.0

connection:
  address: 127.0.0.1
  port: 26421
  add_port: true
  retry_interval_s: 1.0
  ping_interval_s: 20.0
  ping_timeout_s: 20.0
  observation_timeout_s: 30.0
  action_ack_timeout_s: 30.0
  token: null
  token_env: VB_ROBOT_TOKEN
  require_token: true

observation:
  data_type: vitac
  language_prompt: Firstly, use the left hand to pick up the blue tube, and then use the right hand to pick up the green tube. Next, use the left hand to place the blue tube back firstly, and then use the right hand to place the green tube back.
  single_arm_mode: false
  controlled_arm: null
  no_state_obs_mode: false

control:
  control_frequency: 10.0
  controller_frequency: 80.0
  dispatch_lead_time_s: 0.04
  action_horizon: 50
  steps_per_inference: 50

gripper:
  # 左手 VLA <= 0.08：闭合并锁存
  # 右手 VLA <= 0.105：闭合并锁存
  # 闭合后短暂的预测波动不会让夹爪张开
  # 左手 VLA >= 0.10、右手 VLA >= 0.115 时才解除各自锁存
  # 左右手状态相互独立
  # FRS 仍然不修改夹爪 9/19 维，夹爪来源仍是 VLA，只在物理执行端防抖

  left_close_threshold: 0.08
  left_reopen_threshold: 0.10
  left_closed_command: 0.01
  right_close_threshold: 0.105
  right_reopen_threshold: 0.115
  right_closed_command: 0.01

runtime:
  auto_start: false
  warmup_runs: 1
  max_iterations: 0

logging:
  save_observations: true
  output_dir: outputs/pi05_frs_observations
  save_every: 1
  queue_size: 32
