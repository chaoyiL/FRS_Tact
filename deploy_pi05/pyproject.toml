[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot"
version = "0.6.1"
description = "Self-contained Pi0.5 visual and tactile-FRS deployment runtime"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7,<2.12.0",
    "numpy>=2.0.0,<2.3.0",
    "opencv-python-headless>=4.9.0,<4.14.0",
    "einops>=0.8.0,<0.9.0",
    "PyYAML>=6.0.0,<7.0.0",
    "msgpack>=1.0.0,<2.0.0",
    "websockets>=13.0,<16.0",
    "setuptools>=71.0.0,<81.0.0",
    "transformers==4.53.2",
    "jax[cuda12-local]==0.5.3",
    "nvidia-cuda-nvcc-cu12>=12.8,<13; sys_platform == 'linux'",
    "flax==0.10.2",
    "orbax-checkpoint==0.11.13",
    "ml-dtypes==0.4.1",
    "augmax>=0.3.4",
    "beartype==0.19.0",
    "jaxtyping==0.2.36",
    "sentencepiece>=0.2.0",
    "filelock>=3.16.1",
    "fsspec[gcs]>=2024.6.0",
    "tqdm-loggable>=0.2",
    "chex==0.1.90",
    "numpydantic>=1.6.6",
    "pydantic>=2.0.0",
    "typing-extensions>=4.12.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["lerobot*", "utils*"]
