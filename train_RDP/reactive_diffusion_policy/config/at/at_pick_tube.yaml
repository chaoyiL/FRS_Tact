horizon: 32
n_obs_steps: 2
dataset_obs_temporal_downsample_ratio: 2

policy:
  horizon: ${horizon}
  n_latent_dims: 16 # AT encoder/post-quant channels
  mlp_layer_num: 1
  use_conv_encoder: True
  conv_latent_dims: 32
  conv_layer_num: 1
  use_rnn_decoder: True
  rnn_latent_dims: 64
  rnn_layer_num: 1
  kl_multiplier: 1e-6 # keep it small for non-strict regularization
  n_embed: 32 # Gaussian latent channels; LDP predicts an 8 x 32 trajectory
  use_vq: False
  vqvae_groups: 4
  eval: false
  act_scale: 1
  action_loss_version: physical_v2
  position_scale: 0.001
  rotation_scale: 0.017453292519943295
  gripper_scale: 0.005
  idle_position_scale: 0.0001
  idle_rotation_scale: 0.0008726646259971648
  idle_weight: 1.0
  degenerate_weight: 1.0
  rot6_aux_weight: 0.05
